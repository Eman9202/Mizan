<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIZAN | ميزان</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#eaf6f1,#fff8eb);color:#173a31}.app{max-width:620px;margin:auto;min-height:100vh;padding:18px}.logo{text-align:center;font-size:30px;font-weight:900;color:#245f50;margin:10px}.card{background:#fff;border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 12px 34px #173a3118}.hero{text-align:center}.avatar{width:130px;height:130px;border-radius:50%;margin:10px auto;background:linear-gradient(145deg,#d7eee5,#f9e7c9);display:grid;place-items:center;font-size:74px;border:5px solid white}.live .avatar{animation:p 1.5s infinite}@keyframes p{50%{box-shadow:0 0 0 12px #3c806d22}}h2,h3,p{margin:8px 0}.sub{color:#61756e;line-height:1.6}.status{margin:14px auto;padding:10px 14px;border-radius:999px;background:#edf6f2;width:max-content;max-width:100%;font-weight:bold}button,textarea,select{width:100%;padding:14px;border-radius:15px;border:1px solid #d5e3dd;font-size:16px;margin:6px 0}button{border:0;font-weight:800}.primary{background:#245f50;color:#fff}.stop{background:#8f3f3f;color:#fff}.secondary{background:#e9f4ef;color:#173a31}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chat{height:220px;overflow:auto;background:#f7faf8;border-radius:16px;padding:10px;margin:10px 0}.msg{padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.5;max-width:88%}.me{background:#dcefe7;margin-right:auto}.ai{background:#fff0d7;margin-left:auto}.small{font-size:12px;color:#6c7d77}
</style></head><body><div class="app"><div class="logo">⚖️ MIZAN | ميزان</div>
<div class="card hero" id="hero"><div class="avatar" id="avatar">👩‍⚕️</div><h2>رفيقك الصحي الذكي</h2><p class="sub">احكي بطريقتك الطبيعية. ميزان يسمعك ويرد بصوت AI مباشر.</p><div class="status" id="status">جاهز للبدء</div>
<select id="lang"><option value="ar">العربية</option><option value="sv">Svenska</option><option value="en">English</option><option value="tr">Türkçe</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select>
<div class="grid"><button class="secondary" onclick="setAvatar('female')">👩‍⚕️ ميزان</button><button class="secondary" onclick="setAvatar('male')">🧑‍⚕️ ميزان</button></div><button class="primary" id="voiceBtn" onclick="toggleVoice()">🎙️ ابدأ المحادثة الصوتية</button></div>
<div class="card"><h3>💬 الكتابة اختيارية</h3><div class="chat" id="chat"><div class="msg ai">أهلاً 🌿 اضغطي زر المحادثة واحكي معي، أو اكتبي هنا.</div></div><textarea id="text" placeholder="اكتبي رسالة..."></textarea><button class="secondary" onclick="sendText()">إرسال كتابة</button></div>
<div class="card"><h3>🌿 اختصارات</h3><div class="grid"><button class="secondary" onclick="sendPreset('ساعدني أختار وجبة صحية سهلة من الموجود عندي')">🥗 وجبة</button><button class="secondary" onclick="sendPreset('اسألني عن الألم والتعب ثم اقترح حركة مناسبة اليوم')">🚶 حركة</button><button class="secondary" onclick="sendPreset('ساعدني أتابع تقدمي بدون ضغط')">📈 تقدمي</button><button class="secondary" onclick="sendPreset('حفزني بكلام قصير وواقعي')">💚 تحفيز</button></div><p class="small">ميزان لا يشخّص الأمراض ولا يستبدل الطبيب. عند أعراض خطرة اطلب الرعاية الطبية المناسبة.</p></div></div>
<script>
const TOKEN_URL="https://mizan-ai.jodi1690.workers.dev";let pc,dc,stream,audioEl,connected=false;
function setAvatar(x){avatar.textContent=x==="female"?"👩‍⚕️":"🧑‍⚕️"}function st(t){status.textContent=t}function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function startVoice(){try{st("جاري تشغيل ميزان...");let tr=await fetch(TOKEN_URL,{cache:"no-store"});if(!tr.ok)throw Error("token");let tok=await tr.json(),key=tok.value;if(!key)throw Error("key");
pc=new RTCPeerConnection();audioEl=document.createElement("audio");audioEl.autoplay=true;pc.ontrack=e=>audioEl.srcObject=e.streams[0];stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel("oai-events");
dc.onopen=()=>{connected=true;hero.classList.add("live");voiceBtn.textContent="⏹️ إنهاء المحادثة";voiceBtn.className="stop";st("🎙️ أنا أسمعك... احكي");let ln={ar:"العربية الطبيعية السهلة",sv:"السويدية",en:"الإنجليزية",tr:"التركية",fr:"الفرنسية",de:"الألمانية",es:"الإسبانية"}[lang.value];dc.send(JSON.stringify({type:"session.update",session:{type:"realtime",instructions:`أنت MIZAN رفيق صحي ذكي ودافئ. تحدث بـ${ln}. كلامك طبيعي غير مترجم حرفياً، قصير وتفاعلي، سؤال واحد كل مرة. احترم الثقافة والدين والاختيارات الغذائية. لا تشخص ولا تعد بنتائج أو تنحيف موضعي. قبل الرياضة اسأل عن الألم والتعب. انتبه للحمل والرضاعة والدورة والحساسيات والأمراض والأدوية. عند أعراض خطرة وجّه للرعاية الطبية. في الوصفات اسأل أولاً عما هو موجود وما يحبه الشخص.`}}))};
dc.onmessage=e=>{try{let v=JSON.parse(e.data);if(v.type==="input_audio_buffer.speech_started")st("👂 أسمعك...");if(v.type==="input_audio_buffer.speech_stopped")st("✨ ميزان يفكر...");if(v.type==="response.output_audio_transcript.done"&&v.transcript){add(v.transcript,"ai");st("🎙️ أنا أسمعك... احكي")}if(v.type==="conversation.item.input_audio_transcription.completed"&&v.transcript)add(v.transcript,"me");if(v.type==="error")st("حدث خطأ في جلسة الصوت")}catch(_){}};let offer=await pc.createOffer();await pc.setLocalDescription(offer);let sr=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:offer.sdp,headers:{Authorization:`Bearer ${key}`,"Content-Type":"application/sdp"}});if(!sr.ok)throw Error(await sr.text());await pc.setRemoteDescription({type:"answer",sdp:await sr.text()})}catch(e){console.error(e);st("تعذر تشغيل الصوت. تأكدي من إذن الميكروفون وجربي مرة ثانية.");stopVoice(false)}}
function stopVoice(msg=true){connected=false;if(dc)try{dc.close()}catch(e){}if(pc)try{pc.close()}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());dc=pc=stream=null;hero.classList.remove("live");voiceBtn.textContent="🎙️ ابدأ المحادثة الصوتية";voiceBtn.className="primary";if(msg)st("تم إنهاء المحادثة")}
function toggleVoice(){connected?stopVoice():startVoice()}function sendText(){let t=text.value.trim();if(t){text.value="";sendPreset(t)}}function sendPreset(t){add(t,"me");if(!connected||!dc||dc.readyState!=="open"){st("شغّلي المحادثة الصوتية أولاً");return}dc.send(JSON.stringify({type:"conversation.item.create",item:{type:"message",role:"user",content:[{type:"input_text",text:t}]}}));dc.send(JSON.stringify({type:"response.create",response:{output_modalities:["audio"]}}))}
</script></body></html>
